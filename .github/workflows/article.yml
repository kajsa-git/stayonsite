name: Weekly Blog Article

on:
  # Every Wednesday at 09:00 CET (08:00 UTC)
  schedule:
    - cron: '0 8 * * 3'

  # Manual trigger from GitHub or webhook
  workflow_dispatch:
    inputs:
      topic:
        description: 'Article topic (leave empty for auto-pick)'
        required: false
        type: string

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Generate article
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "${{ inputs.topic }}" ]; then
            node scripts/generate-article.mjs --topic "${{ inputs.topic }}"
          else
            node scripts/generate-article.mjs
          fi

      - name: Build to verify
        id: build
        env:
          # Bygget importerar CRM-modulerna (libSQL-klient + Auth.js Drizzle-adapter)
          # vid page-data-insamling. Klienten valideras vid skapande men ansluter inte,
          # och inga DB-queries körs i bygget (dynamiska routes + try/catch i sitemap),
          # så en platshållar-URL räcker för att verifiera att artikeln kompilerar.
          TURSO_DATABASE_URL: "file::memory:"
        run: |
          npm install -g pnpm
          pnpm install --frozen-lockfile
          pnpm build

      - name: Upload generated files on failure
        if: failure() && steps.build.conclusion == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: generated-article-debug
          path: |
            src/views/blogg/
            src/data/blog-posts.ts
            app/(sv)/blogg/[slug]/page.tsx
          retention-days: 7

      - name: Open draft pull request
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="automation/blog-$(date +%Y-%m-%d)-${GITHUB_RUN_ID}"
          git switch -c "$BRANCH"
          git add -A
          git diff --staged --quiet && echo "No changes" && echo "created=false" >> "$GITHUB_OUTPUT" && exit 0
          git commit -m "blogg: utkast till veckoartikel $(date +%Y-%m-%d)

          AI-assisterat utkast genererat av article.yml för redaktionell granskning"
          git push origin "$BRANCH"
          gh pr create \
            --draft \
            --base main \
            --head "$BRANCH" \
            --title "Bloggutkast: $(date +%Y-%m-%d)" \
            --body "Automatiskt framtaget artikelutkast. Kontrollera särskilt författarskap, primärkällor, lokala sakuppgifter, siffror och säljbudskap innan merge."
          echo "created=true" >> "$GITHUB_OUTPUT"

      # IndexNow körs av indexnow.yml först när det granskade utkastet mergas till main.
