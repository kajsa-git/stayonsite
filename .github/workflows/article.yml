name: Biweekly Blog Article

on:
  # GitHub cron saknar ett exakt "varannan vecka"-uttryck. Flödet vaknar varje
  # onsdag men publicerar bara på jämna ISO-veckor. Manuell körning publicerar
  # alltid, oavsett vecka.
  schedule:
    - cron: '0 8 * * 3'

  # Manual trigger from GitHub or webhook
  workflow_dispatch:
    inputs:
      topic:
        description: 'Article topic (leave empty for auto-pick)'
        required: false
        type: string

jobs:
  generate:
    runs-on: ubuntu-latest
    concurrency:
      group: biweekly-blog-publisher
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Check publishing week
        id: cadence
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Manual run — publishing is enabled."
            exit 0
          fi

          iso_week=$(date -u +%V)
          if [ $((10#$iso_week % 2)) -eq 0 ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "ISO week $iso_week — publishing is enabled."
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "ISO week $iso_week — skipping this week."
          fi

      - name: Checkout
        if: steps.cadence.outputs.publish == 'true'
        uses: actions/checkout@v6

      - name: Setup Node
        if: steps.cadence.outputs.publish == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        if: steps.cadence.outputs.publish == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Generate article
        if: steps.cadence.outputs.publish == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ARTICLE_TOPIC: ${{ inputs.topic }}
        run: |
          if [ -n "$ARTICLE_TOPIC" ]; then
            node scripts/generate-article.mjs --topic "$ARTICLE_TOPIC"
          else
            node scripts/generate-article.mjs
          fi

      - name: Build to verify
        if: steps.cadence.outputs.publish == 'true'
        id: build
        env:
          # Bygget importerar CRM-modulerna (libSQL-klient + Auth.js Drizzle-adapter)
          # vid page-data-insamling. Klienten valideras vid skapande men ansluter inte,
          # och inga DB-queries körs i bygget (dynamiska routes + try/catch i sitemap),
          # så en platshållar-URL räcker för att verifiera att artikeln kompilerar.
          TURSO_DATABASE_URL: "file::memory:"
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Upload generated files on failure
        if: failure() && steps.build.conclusion == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: generated-article-debug
          path: |
            src/views/blogg/
            src/data/blog-posts.ts
            app/(sv)/blogg/[slug]/page.tsx
          retention-days: 7

      - name: Publish to main
        if: steps.cadence.outputs.publish == 'true'
        id: push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && echo "No changes" && echo "pushed=false" >> "$GITHUB_OUTPUT" && exit 0
          git commit -m "blogg: ny artikel $(date +%Y-%m-%d)

          AI-assisterad artikel som passerat käll-, innehålls- och byggkontroll"
          git push origin main
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # Push med GITHUB_TOKEN triggar inte indexnow.yml, så den nya artikeln
      # skickas till IndexNow här när Vercel hunnit publicera den.
      - name: Ping IndexNow
        if: steps.push.outputs.pushed == 'true'
        run: |
          echo "Väntar 120s på Vercel-deploy innan IndexNow-submit..."
          sleep 120
          node scripts/indexnow-submit.mjs --all
