name: Mejlsynk till CRM

on:
  # Den ordinarie synken schemaläggs i vercel.json.
  workflow_dispatch:

concurrency:
  group: email-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Läs nya Gmail-mejl och koppla dem i CRM
        env:
          SYNC_SECRET: ${{ secrets.QUALIFICATION_SYNC_SECRET }}
        run: |
          test -n "$SYNC_SECRET"
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-all-errors --max-time 90 \
            -H "Authorization: Bearer $SYNC_SECRET" \
            https://www.stayonsite.se/api/cron/email-sync
