name: Kvalificeringssvar till CRM

on:
  schedule:
    # Var 15:e minut under svensk arbetsdag. GitHub använder UTC; intervallet
    # täcker 08–18 sommartid och 07–17 vintertid.
    - cron: "*/15 6-16 * * 1-5"
  workflow_dispatch:

concurrency:
  group: qualification-replies
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Läs Gmail-svar och uppdatera CRM
        env:
          QUALIFICATION_SYNC_SECRET: ${{ secrets.QUALIFICATION_SYNC_SECRET }}
        run: |
          test -n "$QUALIFICATION_SYNC_SECRET"
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-all-errors --max-time 90 \
            -H "Authorization: Bearer $QUALIFICATION_SYNC_SECRET" \
            https://www.stayonsite.se/api/cron/qualification-replies
